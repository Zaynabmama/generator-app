services:
  # Backend API (FastAPI + MongoDB)
  - type: web
    name: generator-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: generator_app
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"

  # Frontend (Expo web build, served as a static site)
  - type: web
    name: generator-app
    runtime: static
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: generator-backend
          envVarKey: RENDER_EXTERNAL_URL
